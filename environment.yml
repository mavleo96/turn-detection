# Conda env `turn`, exported with `conda env export -n turn --no-builds` (2026-10-24), for training, scripts,
# tests, serving and the demo. Changes to the raw export: the `prefix:` line and the local package
# (turn-detection) are removed, and torch comes from the PyTorch CUDA 13.0 index (+cu130 build).
#   conda env create -f environment.yml && conda activate turn && pip install --no-deps -e .
name: turn
channels:
  - conda-forge
  - nvidia
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.10.19
  - ld_impl_linux-64=2.46.1
