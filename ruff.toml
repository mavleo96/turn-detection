# Ruff config for the whole repo (demo/, src/, scripts/, tests/).
target-version = "py312"
# Modules found here are first-party for import sorting.
src = ["src", "scripts", "."]
line-length = 120

[lint]
# pycodestyle errors/warnings, pyflakes, import sorting
select = ["E", "F", "W", "I"]

[lint.isort]
known-first-party = ["backend", "frontend"]
