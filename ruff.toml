# Ruff config for the whole repo (src/, scripts/, tests/, serve/, results/).
target-version = "py312"
# Modules found here are first-party for import sorting.
src = ["src", "scripts", "."]
line-length = 120

[lint]
# pycodestyle errors/warnings, pyflakes, import sorting
select = ["E", "F", "W", "I"]

[lint.isort]
# Note: with "." in src, a local wandb/ run directory would make wandb first-party (import order then depends on
# the machine)
known-third-party = ["wandb"]
