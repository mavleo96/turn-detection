# The `turn_detection` package (src/turn_detection/: data, model, train).
#   pip install -e ".[train]"   training, evaluation, scripts and tests (editable: turn_detection.data paths resolve
#                               to this checkout); the exact training env is pinned in requirements.txt
#   pip install .               core only: the model and audio preprocessing, enough to serve (see serve/); decoding
#                               is the caller's (torchcodec as in training, or anything that gives 16 kHz mono)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turn-detection"
version = "0.1.0"
description = "End-of-turn detection for voice-agent pipelines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "soxr>=0.5",
    "torch>=2.6",
    "transformers>=5.20",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.15",
    "datasets>=5.1",
    "matplotlib>=3.11",
    "onnx>=1.23",  # scripts/export_onnx.py
    "onnxruntime>=1.31",  # scripts/run_eval_baseline.py (Smart Turn v3), scripts/export_onnx.py
    "onnxscript>=0.7",  # scripts/export_onnx.py (the dynamo exporter)
    "pandas>=3.1",
    "pyarrow>=26.0",  # pandas.read_parquet
    "scikit-learn>=1.9",
    "soundfile>=0.13",  # scripts and tests: writing WAV / FLAC
    "torch-audiomentations>=0.12",
    "torchcodec>=0.17",  # audio decoding through datasets (EoTDataset, scripts)
    "wandb>=0.31",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["turn_detection*"]
