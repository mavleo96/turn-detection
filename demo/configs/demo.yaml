backend:
  asr:
    model_id: nvidia/nemotron-speech-streaming-en-0.6b
    # Streaming latency (chunk = current frame + lookahead). Supported: 160, 560, 1120.
    # (80 ms is not supported yet: the Transformers feature extractor fails on its first chunk.)
    chunk_latency_ms: 160
    dtype: float32
    device: cuda
  vad:
    threshold: 0.5
    # Silence needed before VAD declares end of speech; this also triggers the ASR flush.
    min_silence_ms: 200
    # Padding Silero adds to reported segment bounds. Latency metrics use the unpadded bounds.
    speech_pad_ms: 30
  server:
    host: 127.0.0.1
    port: 8000
  runs_dir: runs

frontend:
  host: 127.0.0.1
  port: 7860
  # Where the frontend reaches the backend (REST + audio WebSocket proxy).
  backend_url: http://127.0.0.1:8000
